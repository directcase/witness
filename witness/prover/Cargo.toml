[package]
name = "witness-prover"
version = "0.1.0"
edition = "2021"
publish = false
description = "TLSNotary prover client for a tlsn-extension style verifier (/session + /verifier)"

[dependencies]
tlsn = { git = "https://github.com/tlsnotary/tlsn.git", tag = "v0.1.0-alpha.15", features = ["mozilla-certs"] }
async-tungstenite = { version = "0.29", features = ["tokio-runtime", "tokio-rustls-webpki-roots"] }
ws_stream_tungstenite = "0.15"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_json = "1"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
url = "2"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
